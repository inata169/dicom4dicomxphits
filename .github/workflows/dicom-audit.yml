name: DICOM audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dicom-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Verify privacy and integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-audit.txt

      - name: Install audit dependency
        run: python -m pip install --requirement requirements-audit.txt

      - name: Audit DICOM privacy and integrity
        run: python scripts/audit_dicom.py --check-checksums
