name: DICOM audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dicom-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Verify privacy and integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Materialize trusted audit implementation
        env:
          TRUSTED_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          workspace_real="$(realpath "${GITHUB_WORKSPACE}")"
          trusted_dir="${workspace_real}/.trusted"

          # The proposed tree may contain .trusted as a symlink. Remove that
          # attacker-controlled path before writing the trusted audit copy.
          rm -rf -- "${trusted_dir}"
          mkdir -- "${trusted_dir}"
          test ! -L "${trusted_dir}"
          test "$(realpath "${trusted_dir}")" = "${trusted_dir}"

          git show "${TRUSTED_SHA}:scripts/audit_dicom.py" > "${trusted_dir}/audit_dicom.py"
          git show "${TRUSTED_SHA}:requirements-audit.txt" > "${trusted_dir}/requirements-audit.txt"

      - name: Install audit dependency
        run: python -m pip install --requirement .trusted/requirements-audit.txt

      - name: Test audit implementation
        run: python -m unittest discover -s tests -v

      - name: Audit DICOM privacy and integrity
        run: python .trusted/audit_dicom.py --check-checksums
